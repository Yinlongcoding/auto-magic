<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; padding: 12px; width: 320px; color: #1b1b1b; }
    button { width: 100%; padding: 7px 10px; margin-bottom: 6px; border: 0; border-radius: 4px; background: #0f6cbd; color: #fff; cursor: pointer; font: inherit; }
    button.secondary { background: #e8e8e8; color: #1b1b1b; }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: #555; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <button id="probe" type="button">探测当前页面并发送到 AM</button>
  <button id="download" class="secondary" type="button" disabled>另存为文件</button>
  <div id="status">在 1688 搜索结果页或商品详情页点击探测。</div>
  <script src="popup.js" type="module"></script>
</body>
</html>
