<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Magic 1688 Collector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="titleRow">
        <h1>1688 商品采集</h1>
        <span id="extensionVersion" class="versionBadge" aria-label="Chrome插件版本"></span>
      </div>
      <label for="keyword">搜索关键词</label>
      <input id="keyword" maxlength="100" value="连衣裙" autocomplete="off" />
      <button id="start" type="button">开始验证</button>
      <p id="status" role="status">尚未执行</p>
      <section id="resultSection" hidden>
        <div class="resultHeader">
          <strong>JSON结果</strong>
          <button id="copy" class="secondary" type="button">复制</button>
        </div>
        <pre id="result"></pre>
      </section>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
